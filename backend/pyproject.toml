[project]
name = "find-your-mechanic-backend"
version = "0.1.0"
description = "Find Your Mechanic — MVP backend (FastAPI + PostgreSQL/PostGIS)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.0",
    "psycopg2-binary>=2.9.9",
    # Pydantic
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.2.0",
    # Auth / Security
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # Utilities
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "timezonefinder>=6.5.0",
    "pillow>=10.4.0",
    "slowapi>=0.1.9",
    "structlog>=24.2.0",
    # Email (stub-ready)
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
